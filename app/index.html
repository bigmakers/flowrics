<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-itunes-app" content="app-id=6761411700">
<meta name="description" content="Flowrics Web - YouTube の音楽に合わせて歌詞が弾幕のように流れるプレイヤー">
<title>Flowrics Web - Danmaku Lyrics for YouTube</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Noto+Sans+JP:wght@300;700;900&family=Noto+Serif+JP:wght@300;700;900&family=M+PLUS+Rounded+1c:wght@300;700;900&family=Zen+Maru+Gothic:wght@300;700;900&family=Zen+Kaku+Gothic+New:wght@300;700;900&family=Shippori+Mincho:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --c1:#F6A656;--c2:#DF4384;--c3:#43B8B1;
  --bg:#0a0a0a;--panel:rgba(14,14,16,.94);--fg:#fff;--muted:#9a9a9a;--line:#2a2a2e;
  --dim:.75;--dm-font:'Klee One',cursive;--dm-color:#fff;--dm-shadow-strong:rgba(0,0,0,.9);--dm-shadow-soft:rgba(0,0,0,.7);--stage-bg:#000;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Hiragino Sans','Noto Sans JP',sans-serif;overflow:hidden;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--c3)}

/* ---------- stage ---------- */
#stage{position:fixed;inset:0;overflow:hidden;background:var(--stage-bg)}
#player-wrap{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:100vw;height:56.25vw;min-height:100vh;min-width:177.78vh}
#player{width:100%;height:100%;display:block}
#dim{position:absolute;inset:0;background:var(--stage-bg);opacity:var(--dim);pointer-events:none}
#danmaku{position:absolute;inset:0;overflow:hidden;pointer-events:none}
#pv{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none;display:none}
body.pvmode #pv{display:block}
body.pvmode #danmaku,body.pvmode #nowline{display:none}
.sub{margin:6px 0 14px 10px;padding-left:12px;border-left:2px solid var(--line)}
.sub[hidden]{display:none}
/* iOS 版 DanmakuUIView の移植: 文字種ごとにサイズ・太さ・影を変え、ベースラインで揃える */
.dm{position:absolute;left:100%;top:0;display:flex;align-items:baseline;white-space:nowrap;font-family:var(--dm-font);color:var(--dm-color);line-height:1.25;will-change:transform;animation:fly linear forwards}
.dm span{display:inline-block;white-space:pre}
.dm .k{font-weight:900;text-shadow:2px 2px 6px var(--dm-shadow-strong)}                     /* 漢字 */
.dm .h{font-weight:300;text-shadow:2px 2px 3px var(--dm-shadow-soft)}                       /* ひらがな */
.dm .kt{font-weight:700;font-style:italic;text-shadow:2px 2px 6px var(--dm-shadow-strong)}  /* カタカナ */
.dm .lM{font-weight:900;text-shadow:2px 2px 6px var(--dm-shadow-strong)}                    /* 英語: 重要語 */
.dm .lm{font-weight:300;text-shadow:2px 2px 3px var(--dm-shadow-soft)}                      /* 英語: 機能語 */
.dm .o{font-weight:400;text-shadow:2px 2px 3px var(--dm-shadow-soft)}                       /* 記号など */
@keyframes fly{from{transform:translateX(0)}to{transform:translateX(var(--dist))}}
#danmaku.paused .dm,#danmaku.paused .dm span{animation-play-state:paused}
/* 歌詞のタイミングに合わせた動き: メイン層の発射時に文字グループが順に弾む */
.dm.pop span{animation:pop .55s cubic-bezier(.2,1.6,.4,1) both}
.dm.pop.strong span{animation:popStrong .65s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{0%{transform:translateY(.35em) scale(.6);opacity:0}60%{transform:translateY(-.12em) scale(1.12);opacity:1}100%{transform:none;opacity:1}}
@keyframes popStrong{0%{transform:translateY(.7em) scale(.3) rotate(-6deg);opacity:0}55%{transform:translateY(-.22em) scale(1.28) rotate(2deg);opacity:1}100%{transform:none;opacity:1}}
#stage.beat{animation:beat .32s ease-out}
@keyframes beat{0%{transform:scale(1.025)}100%{transform:scale(1)}}
#nowline.pop{animation:nowpop .4s cubic-bezier(.2,1.6,.4,1)}
@keyframes nowpop{0%{transform:scale(.9);opacity:.4}100%{transform:none;opacity:.95}}
#nowline{position:absolute;left:0;right:0;bottom:92px;text-align:center;padding:0 16px;pointer-events:none;
  font-family:var(--dm-font);font-size:26px;font-weight:700;color:var(--dm-color);text-shadow:2px 2px 6px var(--dm-shadow-strong);opacity:.95;
  transition:opacity .2s}
#nowline.hidden{display:none}
#empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;text-align:center;padding:24px;pointer-events:none}
#empty h1{font-size:2.4em;background:linear-gradient(135deg,var(--c1),var(--c2),var(--c3));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
#empty p{color:var(--muted);max-width:520px}
#empty.hidden{display:none}
#empty .appstore{pointer-events:auto;display:inline-block;margin-top:6px;padding:10px 18px;border-radius:999px;background:linear-gradient(135deg,var(--c2),var(--c1));color:#fff;font-weight:700;text-decoration:none}

/* ---------- hud ---------- */
#hud{position:fixed;top:0;left:0;right:0;padding:max(10px,env(safe-area-inset-top)) 12px 10px;display:flex;align-items:center;gap:10px;
  background:linear-gradient(rgba(0,0,0,.7),rgba(0,0,0,0));z-index:5;pointer-events:none}
#hud>*{pointer-events:auto}
#hud .meta{flex:1;min-width:0}
#hud .title{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hud .sub{font-size:12px;color:#ccc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:11px;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.12);color:#ddd;white-space:nowrap}
.pill.ok{background:rgba(67,184,177,.28);color:#bff}
.pill.warn{background:rgba(223,67,132,.3);color:#fdd}
.iconbtn{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.12);display:inline-flex;align-items:center;justify-content:center;font-size:17px}
.iconbtn:hover{background:rgba(255,255,255,.22)}
.iconbtn.active{background:var(--c2)}

/* ---------- controls ---------- */
#controls{position:fixed;left:0;right:0;bottom:0;padding:10px 12px max(12px,env(safe-area-inset-bottom));z-index:5;
  background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.75));display:flex;flex-direction:column;gap:6px}
#seek{width:100%;-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;background:rgba(255,255,255,.25);outline:0}
#seek.marked{background:var(--seek-marks,rgba(255,255,255,.25))}
#seek::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--c1)}
#seek::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:var(--c1)}
.row{display:flex;align-items:center;gap:8px}
.time{font-variant-numeric:tabular-nums;font-size:12px;color:#ccc;min-width:86px}
.spacer{flex:1}
#play{width:48px;height:48px;font-size:22px;background:var(--c1);color:#000}
#play:hover{background:#ffb86c}

/* ---------- panel ---------- */
#panel{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-left:1px solid var(--line);z-index:10;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .25s}
#panel.open{transform:none}
#panel header{display:flex;align-items:center;padding:max(10px,env(safe-area-inset-top)) 12px 0;gap:6px}
#panel header .brand{font-weight:800;font-size:16px;background:linear-gradient(135deg,var(--c1),var(--c2),var(--c3));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.tabs{display:flex;border-bottom:1px solid var(--line);margin-top:8px}
.tabs button{flex:1;padding:10px;color:var(--muted);border-bottom:2px solid transparent}
.tabs button.active{color:#fff;border-bottom-color:var(--c2)}
.tab{display:none;flex:1;overflow:auto;padding:14px 12px 24px}
.tab.active{display:block}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
#panel input[type=text],#panel input[type=url],#panel input[type=search],#panel textarea,#panel select{width:100%;padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,.06)}
.field textarea{min-height:130px;font-family:ui-monospace,Menlo,monospace;font-size:12px;resize:vertical}
.field input[type=range]{width:100%}
.inline{display:flex;gap:6px}
.inline input{flex:1}
.btn{padding:9px 14px;border-radius:8px;background:rgba(255,255,255,.12);white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.2)}
.btn.primary{background:var(--c2);color:#fff}
.btn.primary:hover{background:#f05a9a}
.btn.small{padding:5px 9px;font-size:12px}
.list{list-style:none;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.list li{display:flex;align-items:center;gap:8px;padding:9px 10px;border-bottom:1px solid var(--line);cursor:pointer}
.list li:last-child{border-bottom:0}
.list li:hover{background:rgba(255,255,255,.06)}
.list li.current{background:rgba(223,67,132,.18)}
.list .t{flex:1;min-width:0;font-size:13px}
.list .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list .t span{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list .x{color:var(--muted);padding:4px 6px}
.list .x:hover{color:#fff}
.empty-note{font-size:12px;color:var(--muted);padding:10px}
.status{font-size:12px;color:var(--muted);margin:6px 0 10px}
.hint{font-size:11px;color:var(--muted);line-height:1.6;margin-top:8px}
.check{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:10px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;padding:8px 4px;font-size:13px;color:var(--muted);background:rgba(255,255,255,.04)}
.seg button.active{background:var(--c2);color:#fff}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatches button{width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,255,255,.3)}
.swatches button.active{border-color:var(--c2);box-shadow:0 0 0 2px rgba(223,67,132,.4)}
.val{float:right;color:#ddd;font-size:12px}
.foot{font-size:11px;color:var(--muted);margin-top:24px;line-height:1.7}

#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:rgba(20,20,20,.95);border:1px solid var(--line);padding:10px 16px;border-radius:10px;font-size:13px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
#toast.show{opacity:1}

@media (max-width:640px){
  #panel{top:auto;height:78vh;width:100%;border-left:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0;transform:translateY(100%)}
  #panel.open{transform:none}
  .time{min-width:0}
  #nowline{bottom:100px}
}
</style>
</head>
<body>

<div id="stage">
  <div id="player-wrap"><div id="player"></div></div>
  <div id="dim"></div>
  <div id="danmaku"></div>
  <canvas id="pv"></canvas>
  <div id="nowline"></div>
  <div id="empty">
    <h1>Flowrics</h1>
    <p data-i18n="empty"></p>
    <a class="appstore" href="https://apps.apple.com/jp/app/id6761411700" target="_blank" rel="noopener" data-i18n="appStore"></a>
  </div>
</div>

<div id="hud">
  <div class="meta">
    <div class="title" id="hudTitle">Flowrics Web</div>
    <div class="sub" id="hudSub"></div>
  </div>
  <span class="pill" id="lyricPill">—</span>
  <button class="iconbtn" id="langBtn" title="Language">EN</button>
  <button class="iconbtn" id="panelBtn" title="Menu">☰</button>
</div>

<div id="controls">
  <input type="range" id="seek" min="0" max="1000" value="0">
  <div class="row">
    <span class="time" id="time">0:00 / 0:00</span>
    <span class="spacer"></span>
    <button class="iconbtn" id="prev" title="Prev">⏮</button>
    <button class="iconbtn" id="play" title="Play">▶</button>
    <button class="iconbtn" id="next" title="Next">⏭</button>
    <span class="spacer"></span>
    <button class="iconbtn" id="repeat" title="Repeat">🔁</button>
  </div>
</div>

<aside id="panel">
  <header>
    <span class="brand">Flowrics Web</span>
    <span class="spacer"></span>
    <button class="btn small" id="langBtn2">EN</button>
    <button class="btn small" id="shareBtn" data-i18n="share"></button>
    <button class="iconbtn" id="closePanel">✕</button>
  </header>
  <div class="tabs">
    <button data-tab="queue" class="active" data-i18n="tabQueue"></button>
    <button data-tab="lyrics" data-i18n="tabLyrics"></button>
    <button data-tab="settings" data-i18n="tabSettings"></button>
  </div>

  <section class="tab active" id="tab-queue">
    <div class="field">
      <label data-i18n="ytSearch"></label>
      <div class="inline">
        <input type="search" id="ytq" autocomplete="off" data-i18n-ph="ytSearchPh">
        <button class="btn primary" id="ytSearchBtn" data-i18n="search"></button>
      </div>
      <div class="status" id="ytStatus"></div>
      <ul class="list" id="ytResults" hidden></ul>
    </div>
    <div class="field">
      <label data-i18n="ytUrl"></label>
      <div class="inline">
        <input type="url" id="urlInput" placeholder="https://www.youtube.com/watch?v=... / playlist?list=..." autocomplete="off">
        <button class="btn primary" id="addBtn" data-i18n="add"></button>
      </div>
      <div class="hint" data-i18n="ytHint"></div>
    </div>
    <ul class="list" id="queueList"></ul>
    <div class="row" style="margin-top:10px">
      <div class="inline" style="flex:1">
        <input type="text" id="plName" autocomplete="off" data-i18n-ph="plNamePh">
        <button class="btn" id="savePl" data-i18n="plSave"></button>
      </div>
      <button class="btn small" id="clearQueue" data-i18n="clear"></button>
    </div>
    <div class="field" style="margin-top:18px">
      <label data-i18n="plSaved"></label>
      <ul class="list" id="plList"></ul>
    </div>
  </section>

  <section class="tab" id="tab-lyrics">
    <div class="field">
      <label data-i18n="track"></label>
      <input type="text" id="trackInput" autocomplete="off">
    </div>
    <div class="field">
      <label data-i18n="artist"></label>
      <div class="inline">
        <input type="text" id="artistInput" autocomplete="off">
        <button class="btn primary" id="searchBtn" data-i18n="search"></button>
      </div>
    </div>
    <div class="status" id="searchStatus"></div>
    <ul class="list" id="resultList"></ul>
    <div class="field" style="margin-top:14px">
      <label><span data-i18n="offset"></span> <span class="val" id="offsetVal">0.0s</span></label>
      <input type="range" id="offset" min="-5" max="5" step="0.1" value="0">
    </div>
    <div class="field">
      <label data-i18n="lrcManual"></label>
      <textarea id="lrcText" placeholder="[00:12.34] ..."></textarea>
      <div class="row" style="margin-top:6px">
        <span class="spacer"></span>
        <button class="btn" id="applyLrc" data-i18n="applyLrc"></button>
      </div>
    </div>
  </section>

  <section class="tab" id="tab-settings">
    <div class="field">
      <label data-i18n="mode"></label>
      <div class="seg" id="modeSeg">
        <button data-v="pv" data-i18n="modePv"></button>
        <button data-v="danmaku" data-i18n="modeDanmaku"></button>
      </div>
    </div>
    <div class="sub" id="pvOpts" hidden>
      <div class="field">
        <label data-i18n="pvStyle"></label>
        <select id="pvStyle"></select>
      </div>
      <div class="row" style="margin-bottom:12px;flex-wrap:wrap">
        <button class="btn primary" id="pvOmakase" data-i18n="pvOmakase"></button>
        <button class="btn" id="pvReroll" data-i18n="pvReroll"></button>
        <span class="hint" id="pvMood" style="margin:0"></span>
      </div>
      <label class="check"><input type="checkbox" id="pvPerSong"> <span data-i18n="pvPerSong"></span></label>
      <div class="field">
        <label data-i18n="pvBg"></label>
        <div class="seg" id="pvBgSeg">
          <button data-v="transparent" data-i18n="pvBgTransparent"></button>
          <button data-v="opaque" data-i18n="pvBgOpaque"></button>
        </div>
      </div>
      <div class="hint" data-i18n="pvHint"></div>
    </div>
    <div class="field">
      <label data-i18n="fontSize"></label>
      <div class="seg" id="sizeSeg">
        <button data-v="random" data-i18n="sizeRandom"></button>
        <button data-v="medium" data-i18n="sizeMedium"></button>
        <button data-v="large" data-i18n="sizeLarge"></button>
        <button data-v="xl" data-i18n="sizeXL"></button>
      </div>
    </div>
    <div class="field">
      <label data-i18n="motion"></label>
      <div class="seg" id="motionSeg">
        <button data-v="off" data-i18n="motionOff"></button>
        <button data-v="soft" data-i18n="motionSoft"></button>
        <button data-v="strong" data-i18n="motionStrong"></button>
      </div>
      <div class="hint" data-i18n="motionHint"></div>
    </div>
    <div class="field">
      <label data-i18n="font"></label>
      <select id="font"></select>
    </div>
    <div class="field">
      <label data-i18n="bg"></label>
      <div class="swatches" id="bgSwatches"></div>
    </div>
    <div class="field">
      <label><span data-i18n="dim"></span> <span class="val" id="dimVal"></span></label>
      <input type="range" id="dimRange" min="0" max="0.9" step="0.05">
    </div>
    <div class="field">
      <label><span data-i18n="speed"></span> <span class="val" id="speedVal"></span></label>
      <input type="range" id="speed" min="3" max="15" step="1">
    </div>
    <label class="check"><input type="checkbox" id="chorusBoost"> <span data-i18n="chorusBoost"></span></label>
    <div class="hint" style="margin:-4px 0 12px" data-i18n="chorusHint"></div>
    <label class="check"><input type="checkbox" id="showNow"> <span data-i18n="showNow"></span></label>
    <label class="check"><input type="checkbox" id="skipCredits"> <span data-i18n="skipCredits"></span></label>
    <div class="hint" data-i18n="keys"></div>
    <div class="foot">
      <span data-i18n="credits"></span><br>
      <a href="https://bigmakers.github.io/flowrics/">Flowrics</a> · <a href="https://bigmakers.github.io/flowrics/privacy.html" data-i18n="privacy"></a> · <a href="https://bigmakers.github.io/flowrics/support.html" data-i18n="support"></a> · <a href="https://apps.apple.com/jp/app/id6761411700" target="_blank" rel="noopener" data-i18n="appStoreShort"></a> · <span id="build">build @BUILD@</span>
    </div>
  </section>
</aside>

<div id="toast"></div>

<script>
'use strict';
/* ===================== i18n ===================== */
const I18N = {
  ja: {
    empty: '右上の ☰ から YouTube の URL を追加すると、曲に合わせて歌詞が文字PVとして動きます。設定で弾幕表示にも切り替えられます。',
    share: '共有', tabQueue: 'キュー', tabLyrics: '歌詞', tabSettings: '設定',
    ytSearch: 'YouTube を検索', ytSearchPh: '曲名 アーティスト', ytSearching: '検索中…', ytNoResults: '見つかりませんでした。', ytSearchFail: '検索サーバーに接続できませんでした。YouTube の検索結果を新しいタブで開いたので、動画の URL をコピーして下の欄に貼り付けてください。',
    ytUrl: 'YouTube の URL(動画 / プレイリスト)または動画ID', add: '追加',
    plImporting: 'プレイリストを読み込んでいます…', plImported: (n) => `プレイリストから ${n} 曲を追加しました`, plImportFail: 'プレイリストを読み込めませんでした(非公開、または存在しない可能性があります)。',
    plNamePh: 'プレイリスト名', plSave: '保存', plSaved: '保存したプレイリスト', plNone: 'まだありません。キューに曲を入れて名前を付けて保存すると、ここから呼び出せます。',
    plSavedToast: (n) => `「${n}」を保存しました`, plLoaded: (n) => `「${n}」を読み込みました`, plCount: (n) => `${n} 曲`, plNeedName: 'プレイリスト名を入力してください', plEmpty: 'キューが空です',
    ytHint: '動画の URL(watch / youtu.be / Shorts)を貼ると 1 曲、プレイリストの URL(list=…)を貼ると全曲をキューに追加します。埋め込みが許可されていない動画は再生できません。',
    clear: 'すべて削除', queueEmpty: 'キューは空です',

const RANDOM_SIZES = [12, 20, 32, 48, 64];          // 「混」
const SIZE_OPT = { random: 0, medium: 20, large: 32, xl: 64 };
const SIZE_RATIO = { kanji: 2.0, hira: 1.0, kata: 1.4, 'latin-major': 2.0, 'latin-minor': 1.0, other: 0.9 };
const TOKEN_CLASS = { kanji: 'k', hira: 'h', kata: 'kt', 'latin-major': 'lM', 'latin-minor': 'lm', other: 'o' };
const STOP_WORDS = new Set(("i me my we our us you your he him his she her it its they them their a an the is am are was were be been " +
  "do does did have has had will would shall should can could may might must in on at to for of with by from up about into through " +
  "and but or so if then than that this not no just very too also as all don't won't can't i'm you're it's we're they're " +
  "i'll you'll he'll she'll we'll they'll isn't aren't wasn't weren't doesn't didn't").split(' '));
function charType(ch) {
  const v = ch.codePointAt(0);
  if (v >= 0x3040 && v <= 0x309F) return 'hira';
  if (v >= 0x30A0 && v <= 0x30FF) return 'kata';
  if ((v >= 0x4E00 && v <= 0x9FFF) || (v >= 0x3400 && v <= 0x4DBF)) return 'kanji';
  if ((v >= 0x41 && v <= 0x5A) || (v >= 0x61 && v <= 0x7A) || (v >= 0x30 && v <= 0x39)) return 'latin';
  return 'other';
}
const isSpace = c => c === ' ' || c === '　';
function tokenize(text) {
  const tokens = []; const chars = Array.from(text); let i = 0;
  while (i < chars.length) {
    const ch = chars[i];
    if (isSpace(ch)) { if (tokens.length) tokens[tokens.length - 1].text += ch; i++; continue; }
    const type = charType(ch);
    if (type === 'latin') {
      let word = '';
      while (i < chars.length && (charType(chars[i]) === 'latin' || chars[i] === "'")) word += chars[i++];
      while (i < chars.length && isSpace(chars[i])) word += chars[i++];
      const minor = STOP_WORDS.has(word.trim().toLowerCase());
      tokens.push({ type: minor ? 'latin-minor' : 'latin-major', text: word });
    } else {
      let group = ch; i++;
      while (i < chars.length) {
        const nc = chars[i];
        if (isSpace(nc)) { group += nc; i++; continue; }
        if (charType(nc) === type) { group += nc; i++; } else break;
      }

    }

}

/* ===================== サビ推定 (歌詞の繰り返しから) ===================== */
const normLine = s => s.replace(/[\s　、。,.!！?？「」『』()（）…・~〜-]/g, '').toLowerCase();
function detectChorus(ls) {
  if (ls.length < 8) return [];
  const keys = ls.map(l => normLine(l.text));
  const cnt = {}; keys.forEach(k => { if (k.length >= 3) cnt[k] = (cnt[k] || 0) + 1; });
  const rep = keys.map(k => (cnt[k] || 0) >= 2);
  // 繰り返し行が連続する区間をブロックにする(1 行だけの途切れはつなぐ)
  const blocks = []; let i = 0;
  while (i < ls.length) {
    if (!rep[i]) { i++; continue; }
    let j = i;
    while (j < ls.length && (rep[j] || (j + 1 < ls.length && rep[j + 1]))) j++;
    blocks.push([i, j]); i = j;
  }
  if (blocks.length < 2) return [];
  const lineDur = (idx) => (idx + 1 < ls.length ? ls[idx + 1].t - ls[idx].t : 5);
  const secs = blocks.map(([a, b]) => ({ start: ls[a].t, end: ls[b - 1].t + Math.min(lineDur(b - 1), 8), lines: b - a }));
  // ほぼ全編が繰り返しならサビとは言えない
  const total = secs.reduce((acc, x) => acc + (x.end - x.start), 0);
  const span = ls[ls.length - 1].t - ls[0].t + 5;
  if (total > span * 0.7) return [];
  return secs;
}
const inChorus = (t) => settings.chorusBoost && chorus.some(c => t >= c.start && t < c.end);
function markSeek(dur) {
  const el = $('#seek');
  if (!settings.chorusBoost || !chorus.length || !dur) { el.classList.remove('marked'); el.style.removeProperty('--seek-marks'); return; }
  const base = 'rgba(255,255,255,.25)', hi = 'rgba(223,67,132,.95)';
  const stops = [];
  let pos = 0;
  chorus.forEach(c => { const a = Math.max(0, c.start / dur * 100), b = Math.min(100, c.end / dur * 100); if (b <= a) return; stops.push(`${base} ${pos}%`, `${base} ${a}%`, `${hi} ${a}%`, `${hi} ${b}%`); pos = b; });
  stops.push(`${base} ${pos}%`, `${base} 100%`);
  el.style.setProperty('--seek-marks', `linear-gradient(90deg, ${stops.join(',')})`);
  el.classList.add('marked');
}

/* ===================== LRC ===================== */
const CREDIT_RE = /^(作词|作曲|编曲|作詞|編曲|词|曲|歌|唱|监制|製作|制作|Lyrics?|Lyricist|Composer|Composed|Arranger?|Arranged|Producer|Produced|Written|Music|Vocals?)\s*(by)?\s*[:：]/i;
function parseLRC(text) {
  const out = [];
  for (const raw of (text || '').split(/\r?\n/)) {
    const tags = [...raw.matchAll(/\[(\d+):(\d+(?:\.\d+)?)\]/g)];
    if (!tags.length) continue;
    const txt = raw.replace(/\[[^\]]*\]/g, '').trim();
    if (!txt) continue;
    if (settings.skipCredits && CREDIT_RE.test(txt)) continue;
    for (const m of tags) out.push({ t: +m[1] * 60 + +m[2], text: txt });
  }
  out.sort((a, b) => a.t - b.t);
  return out;
}
function setLines(newLines, source) {
  lines = newLines; lyricSource = source; clearDanmaku(); setNow(''); lastT = -1;

  if (settings.mode === 'pv') { if (pv.ready) buildPvPlan(); else clearPv(); }
  updatePill();
}
function updatePill() {
  const p = $('#lyricPill'); p.className = 'pill';
  if (lyricSource === 'searching') { p.textContent = t('pillSearching'); }
  else if (lyricSource === 'synced') { p.textContent = t('pillSynced'); p.classList.add('ok'); }
  else if (lyricSource === 'manual') { p.textContent = t('pillManual'); p.classList.add('ok'); }

/* ===================== metadata guess ===================== */
const NOISE = /\b(official|music|video|mv|pv|lyrics?|lyric|audio|hd|hq|4k|full|ver\.?|version|live|cover|feat\.?|ft\.?|remix)\b/gi;
function cleanTitle(s) {
  return (s || '')
    .replace(/[\(\[【（［「『][^\)\]】）］」』]*(official|music|video|mv|pv|lyric|audio|full|ver|4k|hd|公式|ミュージックビデオ|歌詞|フル)[^\)\]】）］」』]*[\)\]】）］」』]/gi, ' ')
    .replace(/[\[\]【】（）()「」『』]/g, ' ')
    .replace(NOISE, ' ')
    .replace(/[|｜]/g, ' ')
    .replace(/\s+/g, ' ').trim();
}
function cleanAuthor(s) {
  return (s || '').replace(/\s*-\s*topic$/i, '').replace(/vevo/gi, '').replace(/\b(official|channel)\b/gi, '').replace(/(公式|チャンネル)/g, '').replace(/\s+/g, ' ').trim();
}
function guessMeta(rawTitle, rawAuthor) {
  const author = cleanAuthor(rawAuthor);
  let title = (rawTitle || '');
  let track = '', artist = '';
  // 「Track」 or 『Track』 pattern: Artist「Track」
  let m = title.match(/^(.*?)[「『]([^」』]+)[」』]/);
  if (m) { artist = cleanTitle(m[1]); track = cleanTitle(m[2]); }
  else {
    const parts = cleanTitle(title).split(/\s+[-–—\/／]\s+/).map(x => x.trim()).filter(Boolean);
    if (parts.length >= 2) {
      const a = parts[0], b = parts.slice(1).join(' ');
      const lower = author.toLowerCase();
      if (lower && b.toLowerCase().includes(lower)) { track = a; artist = b; }
      else if (lower && a.toLowerCase().includes(lower)) { artist = a; track = b; }
      else { artist = a; track = b; }           // default: "Artist - Track"
    } else { track = cleanTitle(title); }
  }
  if (!artist) artist = author;
  return { track: track.trim(), artist: artist.trim(), q: cleanTitle(title) };
}

/* ===================== LRCLIB search ===================== */
// ratio of repeated timestamps: high values usually mean interleaved translation lines
function dupRatio(lrc) {
  const tags = (lrc || '').match(/^\[\d+:\d+(?:\.\d+)?\]/gm) || [];
  if (tags.length < 4) return 0;
  return 1 - new Set(tags).size / tags.length;

async function fetchJSON(url) { const r = await fetch(url, { headers: { 'Accept': 'application/json' } }); if (!r.ok) throw new Error(r.status); return r.json(); }

  const status = $('#searchStatus'); status.textContent = t('searching'); lyricSource = 'searching'; updatePill();
  $('#resultList').innerHTML = '';

  const reqs = [];
  if (track) reqs.push(fetchJSON(`https://lrclib.net/api/search?track_name=${enc(track)}${artist ? '&artist_name=' + enc(artist) : ''}`).catch(() => []));
  if (q) reqs.push(fetchJSON(`https://lrclib.net/api/search?q=${enc(q)}`).catch(() => []));
  if (track && artist) reqs.push(fetchJSON(`https://lrclib.net/api/search?q=${enc(track + ' ' + artist)}`).catch(() => []));
  let results;
  try { results = (await Promise.all(reqs)).flat(); } catch { status.textContent = t('searchErr'); lyricSource = 'none'; updatePill(); return; }
  const seen = new Set();
  const vd = (player && ready) ? player.getDuration() : 0;
  candidates = results.filter(r => r && r.syncedLyrics && !seen.has(r.id) && seen.add(r.id))
    .map(r => ({ ...r, diff: vd > 0 && r.duration ? Math.abs(r.duration - vd) : 999, dup: dupRatio(r.syncedLyrics) }))
    .sort((a, b) => (a.diff + a.dup * 5) - (b.diff + b.dup * 5));
  if (!candidates.length) { status.textContent = t('notFound'); lyricSource = 'none'; updatePill(); return; }

}

/* ===================== sync loop (iOS 版 tickSynced の移植) ===================== */
function tick() {
  requestAnimationFrame(tick);
  if (!ready || !player.getCurrentTime) return;
  const raw = player.getCurrentTime() || 0, dur = player.getDuration() || 0;
  if (!seeking) { $('#seek').value = dur ? Math.round(raw / dur * 1000) : 0; }
  $('#time').textContent = `${fmt(raw)} / ${fmt(dur)}`;
  if (!seekMarked && dur > 0 && chorus.length) { markSeek(dur); seekMarked = true; }
  const playing = player.getPlayerState() === YT.PlayerState.PLAYING;
  if (settings.mode === 'pv') { renderPv(raw + offset, playing); return; }
  if (!playing) return;   // 停止中は発射しない(アニメーションは CSS 側で一時停止)
  const tt = raw + offset + APP_LEAD;
  chorusNow = inChorus(tt);
  if (lastT >= 0 && Math.abs(tt - lastT) > 2) { clearDanmaku(); setNow(''); }   // シーク検知 → 全消去
  lastT = tt;
  for (let i = 0; i < lines.length; i++) {
    const L = lines[i];
    if (L.t + LAYERS[0].offset > tt) break;                         // 以降の行はまだ先
    if (L.t + LAYERS[LAYERS.length - 1].offset + 1 < tt) continue;  // 全レイヤー発射済みの行
    for (const ly of LAYERS) {
      const trig = L.t + ly.offset;
      if (tt < trig || tt >= trig + 1.0) continue;
      const key = i + '_' + ly.id;
      if (fired.has(key)) continue;
      fired.add(key);
      spawn(L.text, ly.opacity, ly.scale, ly.id);
      if (ly.id === 'main') { setNow(L.text); if (settings.motion !== 'off') retrigger($('#nowline'), 'pop'); }
    }
  }
}

const PV_ASPECTS = { '16:9': 16 / 9, '9:16': 9 / 16, '4:3': 4 / 3, '3:4': 3 / 4, '1:1': 1, '21:9': 21 / 9, '4:5': 4 / 5 };

function pad2(n) { return (n < 10 ? '0' : '') + n; }
function lrcOf(ls) {   // 内部の行 → JIZURA が読む LRC。サビ強調オンならサビの行は *強調*
  return ls.map(l => {
    const m = Math.floor(l.t / 60), sec = (l.t - m * 60).toFixed(2);
    const text = l.text.replace(/[*|/]/g, ' ').trim() || '…';
    const em = settings.chorusBoost && chorus.some(c => l.t >= c.start && l.t < c.end);

}
function pickAspect(w, h) {

  for (const [k, v] of Object.entries(PV_ASPECTS)) { const d = Math.abs(Math.log(v / r)); if (d < bd) { bd = d; best = k; } }

}

  pv.project = proj;
  const dur = player && ready ? player.getDuration() : 0;
  try { pv.plan = J.plan(proj, dur > 0 ? { duration: dur } : null); } catch (e) { console.error(e); pv.plan = null; return; }
  pv.need = true; pv.lastT = -1;
  const key = pvState.style + '|' + lines.length + '|' + (lines[0] && lines[0].text);
  if (key !== pv.fontsFor) { pv.fontsFor = key; J.ensureFonts(lines.map(l => l.text).join('') + (item.title || ''), J.fontsOfPlan(pv.plan)).then(() => { pv.need = true; }).catch(() => {}); }
}
function clearPv() { const cv = $('#pv'); cv.getContext('2d').clearRect(0, 0, cv.width, cv.height); }
function renderPv(tt, playing) {
  if (!pv.ready || !pv.plan) return;
  const cv = $('#pv'), ctx = cv.getContext('2d');
  const tm = Math.max(0, Math.min(pv.plan.duration - 0.001, tt));
  if (!playing && !pv.need && Math.abs(tm - pv.lastT) < 0.001) return;
  pv.need = false; pv.lastT = tm;
  const t0 = performance.now();
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height);
  try { pv.renderer.frame(ctx, pv.plan, tm, { scale: cv.width / pv.plan.W, transparent: settings.pvBg !== 'opaque', fast: playing && pv.slow, noHud: true }); } catch (e) {}   // noHud: タイムコード等の HUD は Flowrics 側にあるので出さない
  const dt = performance.now() - t0;   // JIZURA 本体と同じく、遅ければ簡易描画に落とす
  pv.slow = playing ? (dt > 30 ? true : dt < 14 ? false : pv.slow) : false;
}
function savePv() { if (settings.pvPerSong && pvSong) store.set('pv.v.' + pvSong, pvState); else store.set('pv', pvState); }
function seededRng(str) { let a = 0x9e3779b9 ^ str.length; for (const c of str) a = Math.imul(a ^ c.charCodeAt(0), 0x85ebca6b) >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let x = Math.imul(a ^ (a >>> 15), 1 | a); x ^= x + Math.imul(x ^ (x >>> 7), 61 | x); return ((x ^ (x >>> 14)) >>> 0) / 4294967296; }; }
// 曲ごとモード: その曲の記憶があれば使い、なければ動画 ID から決まる「おまかせ」を作って記憶する
function syncPvStateToSong() {
  const vid = queue[cur] && queue[cur].id;
  if (!pv.ready || !settings.pvPerSong || !vid) { pvSong = settings.pvPerSong ? vid || null : null; return; }
  if (pvSong === vid) return;
  pvSong = vid;
  let st = store.get('pv.v.' + vid, null);
  if (!st) {
    const base = Object.assign(J.defaultProject(), store.get('pv', {}));
    const r = J.omakase(base, seededRng(vid));
    st = { style: r.style, mood: r.mood, seed: r.seed, fx: r.fx, enabled: r.enabled, fonts: r.fonts, colors: r.colors };
    store.set('pv.v.' + vid, st);
  }
  pvState = st;
  if ($('#pvStyle').options.length) $('#pvStyle').value = st.style;
  showPvMood();
  if (st.mood && J.MOODS[st.mood] && J.STYLES[st.style]) toast(t('pvSongStyle', J.STYLES[st.style].name, J.MOODS[st.mood].name));
}
function pvOmakase() {
  if (!pv.ready) return;
  const base = Object.assign(J.defaultProject(), pvState);
  const r = J.omakase(base);
  pvState = { style: r.style, mood: r.mood, seed: r.seed, fx: r.fx, enabled: r.enabled, fonts: r.fonts, colors: r.colors };
  savePv(); $('#pvStyle').value = r.style; showPvMood(); buildPvPlan();
  toast(t('pvOmakaseToast', J.STYLES[r.style].name, J.MOODS[r.mood].name));
}
function pvReroll() { pvState.seed = (Math.random() * 1e9) | 0; savePv(); buildPvPlan(); toast(t('pvRerolled')); }
function applyMode() {
  const isPv = settings.mode === 'pv';
  document.body.classList.toggle('pvmode', isPv);
  $('#pvOpts').hidden = !isPv;
  if (isPv) { ensureJizura().then(() => { sizePvCanvas(); buildPvPlan(); }).catch(() => {}); }
  else { clearDanmaku(); }
}

/* ===================== UI wiring ===================== */
function applySettings() {
  const root = document.documentElement.style, bg = BG[settings.bg] || BG.black;
  root.setProperty('--dim', settings.dim);
  root.setProperty('--dm-font', settings.font);
  root.setProperty('--stage-bg', bg.bg);
  root.setProperty('--dm-color', bg.text);
  root.setProperty('--dm-shadow-strong', `rgba(${bg.shadow},.9)`);
  root.setProperty('--dm-shadow-soft', `rgba(${bg.shadow},.7)`);
  $$('#sizeSeg button').forEach(b => b.classList.toggle('active', b.dataset.v === settings.sizeOpt));
  $$('#modeSeg button').forEach(b => b.classList.toggle('active', b.dataset.v === settings.mode));
  $$('#pvBgSeg button').forEach(b => b.classList.toggle('active', b.dataset.v === settings.pvBg));
  $$('#motionSeg button').forEach(b => b.classList.toggle('active', b.dataset.v === settings.motion));
  $$('#bgSwatches button').forEach(b => b.classList.toggle('active', b.dataset.v === settings.bg));
  $('#font').value = settings.font;
  $('#speed').value = settings.flySec; $('#speedVal').textContent = settings.flySec + 's';
  $('#dimRange').value = settings.dim; $('#dimVal').textContent = Math.round(settings.dim * 100) + '%';
  $('#showNow').checked = settings.showNow; $('#skipCredits').checked = settings.skipCredits; $('#chorusBoost').checked = settings.chorusBoost; $('#pvPerSong').checked = settings.pvPerSong;
  $('#nowline').classList.toggle('hidden', !settings.showNow);
  store.set('settings', settings);
}
function bind(id, key, parse, after) {
  $('#' + id).addEventListener('input', e => { settings[key] = parse(e.target); applySettings(); if (after) after(); });
}
// フォント一覧・背景スウォッチ・サイズ切替を生成
FONTS.forEach(([v, label]) => { const o = document.createElement('option'); o.value = v; o.textContent = label; o.style.fontFamily = v; $('#font').appendChild(o); });
Object.entries(BG).forEach(([k, v]) => { const b = document.createElement('button'); b.dataset.v = k; b.style.background = v.bg; b.addEventListener('click', () => { settings.bg = k; applySettings(); }); $('#bgSwatches').appendChild(b); });
$$('#sizeSeg button').forEach(b => b.addEventListener('click', () => { settings.sizeOpt = b.dataset.v; applySettings(); }));
$$('#motionSeg button').forEach(b => b.addEventListener('click', () => { settings.motion = b.dataset.v; applySettings(); }));
$$('#modeSeg button').forEach(b => b.addEventListener('click', () => { if (settings.mode === b.dataset.v) return; settings.mode = b.dataset.v; applySettings(); applyMode(); }));
$$('#pvBgSeg button').forEach(b => b.addEventListener('click', () => { settings.pvBg = b.dataset.v; applySettings(); pv.need = true; }));
$('#pvStyle').addEventListener('change', e => { pvState.style = e.target.value; pvState.mood = null; savePv(); showPvMood(); buildPvPlan(); });
$('#pvOmakase').addEventListener('click', pvOmakase);
bind('pvPerSong', 'pvPerSong', e => e.checked, () => { pvSong = null; if (!settings.pvPerSong) { pvState = store.get('pv', { style: 'noir', mood: null, seed: 20260922 }); if ($('#pvStyle').options.length) $('#pvStyle').value = pvState.style in (window.J ? J.STYLES : {}) ? pvState.style : 'noir'; showPvMood(); } if (settings.mode === 'pv') buildPvPlan(); });
$('#ytSearchBtn').addEventListener('click', () => searchYouTube($('#ytq').value));
$('#ytq').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); searchYouTube($('#ytq').value); } });
$('#pvReroll').addEventListener('click', pvReroll);
window.addEventListener('resize', () => { if (settings.mode === 'pv') sizePvCanvas(); });
$$('#bgSwatches button').forEach(b => { b.title = t('bg' + b.dataset.v[0].toUpperCase() + b.dataset.v.slice(1)); });
bind('speed', 'flySec', e => +e.value);
bind('dimRange', 'dim', e => +e.value);
bind('font', 'font', e => e.value);
bind('showNow', 'showNow', e => e.checked);
bind('chorusBoost', 'chorusBoost', e => e.checked, () => { seekMarked = false; markSeek(player && ready ? player.getDuration() : 0); if (settings.mode === 'pv') buildPvPlan(); });
bind('skipCredits', 'skipCredits', e => e.checked, () => { const txt = $('#lrcText').value; if (txt) setLines(parseLRC(txt), lyricSource === 'none' ? 'manual' : lyricSource); });

$('#panelBtn').addEventListener('click', () => $('#panel').classList.toggle('open'));
$('#closePanel').addEventListener('click', () => $('#panel').classList.remove('open'));
$$('.tabs button').forEach(b => b.addEventListener('click', () => {
  $$('.tabs button').forEach(x => x.classList.toggle('active', x === b));
  $$('.tab').forEach(x => x.classList.toggle('active', x.id === 'tab-' + b.dataset.tab));
}));
function toggleLang() { lang = lang === 'ja' ? 'en' : 'ja'; store.set('lang', lang); applyI18n(); }
$('#langBtn').addEventListener('click', toggleLang);
$('#langBtn2').addEventListener('click', toggleLang);

$('#addBtn').addEventListener('click', () => { if (addUrl($('#urlInput').value)) $('#urlInput').value = ''; });
$('#savePl').addEventListener('click', () => savePlaylist($('#plName').value));
$('#plName').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); savePlaylist($('#plName').value); } });
$('#urlInput').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); $('#addBtn').click(); } });
$('#clearQueue').addEventListener('click', () => { queue = []; cur = -1; saveQueue(); renderQueue(); if (player && ready) player.stopVideo(); setLines([], 'none'); $('#empty').classList.remove('hidden'); $('#hudTitle').textContent = 'Flowrics Web'; $('#hudSub').textContent = ''; });

$('#play').addEventListener('click', () => {
  if (!player || !ready) return;
  if (cur < 0) { if (queue.length) playIndex(0); else $('#panel').classList.add('open'); return; }
  const s = player.getPlayerState();
  if (s === YT.PlayerState.PLAYING) player.pauseVideo(); else player.playVideo();
});
$('#next').addEventListener('click', () => nextTrack(false));
$('#prev').addEventListener('click', prevTrack);
$('#repeat').addEventListener('click', () => { repeat = repeat === 'off' ? 'all' : repeat === 'all' ? 'one' : 'off'; store.set('repeat', repeat); updateRepeatBtn(); toast($('#repeat').title); });
$('#seek').addEventListener('pointerdown', () => seeking = true);
$('#seek').addEventListener('change', e => { seeking = false; if (player && ready) { const d = player.getDuration() || 0; player.seekTo(e.target.value / 1000 * d, true); } });
$('#seek').addEventListener('pointerup', () => seeking = false);

$('#searchBtn').addEventListener('click', () => { const track = $('#trackInput').value.trim(), artist = $('#artistInput').value.trim(); if (!track && !artist) return; searchLyrics({ track, artist, q: (track + ' ' + artist).trim() }, false); });
$('#trackInput').addEventListener('keydown', e => { if (e.key === 'Enter') $('#searchBtn').click(); });
$('#artistInput').addEventListener('keydown', e => { if (e.key === 'Enter') $('#searchBtn').click(); });
$('#applyLrc').addEventListener('click', () => { const L = parseLRC($('#lrcText').value); if (!L.length) { toast(t('lrcEmpty')); return; } candidates.forEach(c => c.picked = false); renderResults(); setLines(L, 'manual'); toast(t('lrcApplied')); });
function setOffset(v) { offset = Math.max(-5, Math.min(5, Math.round(v * 10) / 10)); $('#offset').value = offset; $('#offsetVal').textContent = (offset > 0 ? '+' : '') + offset.toFixed(1) + 's'; if (cur >= 0) store.set('offset.' + queue[cur].id, offset); }
$('#offset').addEventListener('input', e => setOffset(+e.target.value));

$('#shareBtn').addEventListener('click', async () => {
  const url = location.origin + location.pathname + (queue.length ? '?v=' + queue.map(q => q.id).join(',') : '');
  try { await navigator.clipboard.writeText(url); toast(t('copied')); } catch (e) { prompt('URL', url); }
});

document.addEventListener('keydown', e => {
  if (['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName)) return;
  if (!player || !ready) return;
  if (e.code === 'Space') { e.preventDefault(); $('#play').click(); }
  else if (e.key === 'ArrowRight') player.seekTo(player.getCurrentTime() + 5, true);
  else if (e.key === 'ArrowLeft') player.seekTo(Math.max(0, player.getCurrentTime() - 5), true);
  else if (e.key === 'n' || e.key === 'N') nextTrack(false);
  else if (e.key === 'p' || e.key === 'P') prevTrack();
  else if (e.key === '[') setOffset(offset - 0.1);
  else if (e.key === ']') setOffset(offset + 0.1);
});

/* ===================== boot ===================== */
(function boot() {
  lang = store.get('lang', (navigator.language || '').toLowerCase().startsWith('ja') ? 'ja' : 'en');
  const p = new URLSearchParams(location.search);
  const ids = (p.get('v') || p.get('ids') || '').split(',').map(parseId).filter(Boolean);
  if (ids.length) { queue = ids.map(id => ({ id })); saveQueue(); }
  window.__bootList = p.get('list');
  applySettings(); applyI18n(); applyMode();
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
  if ($('#build').textContent.includes('@BUILD@')) $('#build').textContent = 'build dev';
  const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(s);
})();
</script>
