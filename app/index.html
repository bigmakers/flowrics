<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Flowrics Web - YouTube の音楽に合わせて歌詞が弾幕のように流れるプレイヤー">
<title>Flowrics Web - Danmaku Lyrics for YouTube</title>
<style>
:root{
  --c1:#F6A656;--c2:#DF4384;--c3:#43B8B1;
  --bg:#0a0a0a;--panel:rgba(14,14,16,.94);--fg:#fff;--muted:#9a9a9a;--line:#2a2a2e;
  --dm-size:32px;--dim:.35;--dm-font:inherit;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Hiragino Sans','Noto Sans JP',sans-serif;overflow:hidden;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--c3)}

/* ---------- stage ---------- */
#stage{position:fixed;inset:0;overflow:hidden;background:#000}
#player-wrap{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:100vw;height:56.25vw;min-height:100vh;min-width:177.78vh}
#player{width:100%;height:100%;display:block}
#dim{position:absolute;inset:0;background:rgba(0,0,0,var(--dim));pointer-events:none}
#danmaku{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.dm{position:absolute;left:100%;top:0;white-space:nowrap;font-family:var(--dm-font);font-size:var(--dm-size);font-weight:700;line-height:1.3;color:#fff;
  text-shadow:0 0 6px rgba(0,0,0,.95),0 2px 4px rgba(0,0,0,.85),0 0 1px #000;will-change:transform;animation:fly linear forwards}
@keyframes fly{from{transform:translateX(0)}to{transform:translateX(var(--dist))}}
#danmaku.paused .dm{animation-play-state:paused}
#nowline{position:absolute;left:0;right:0;bottom:92px;text-align:center;padding:0 16px;pointer-events:none;
  font-family:var(--dm-font);font-size:calc(var(--dm-size) * .8);font-weight:700;color:#fff;text-shadow:0 0 8px rgba(0,0,0,.95),0 2px 4px rgba(0,0,0,.85);opacity:.95;
  transition:opacity .2s}
#nowline.hidden{display:none}
#empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;text-align:center;padding:24px;pointer-events:none}
#empty h1{font-size:2.4em;background:linear-gradient(135deg,var(--c1),var(--c2),var(--c3));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
#empty p{color:var(--muted);max-width:520px}
#empty.hidden{display:none}

/* ---------- hud ---------- */
#hud{position:fixed;top:0;left:0;right:0;padding:max(10px,env(safe-area-inset-top)) 12px 10px;display:flex;align-items:center;gap:10px;
  background:linear-gradient(rgba(0,0,0,.7),rgba(0,0,0,0));z-index:5;pointer-events:none}
#hud>*{pointer-events:auto}
#hud .meta{flex:1;min-width:0}
#hud .title{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hud .sub{font-size:12px;color:#ccc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:11px;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.12);color:#ddd;white-space:nowrap}
.pill.ok{background:rgba(67,184,177,.28);color:#bff}
.pill.warn{background:rgba(223,67,132,.3);color:#fdd}
.iconbtn{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.12);display:inline-flex;align-items:center;justify-content:center;font-size:17px}
.iconbtn:hover{background:rgba(255,255,255,.22)}
.iconbtn.active{background:var(--c2)}

/* ---------- controls ---------- */
#controls{position:fixed;left:0;right:0;bottom:0;padding:10px 12px max(12px,env(safe-area-inset-bottom));z-index:5;
  background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.75));display:flex;flex-direction:column;gap:6px}
#seek{width:100%;-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;background:rgba(255,255,255,.25);outline:0}
#seek::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--c1)}
#seek::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:var(--c1)}
.row{display:flex;align-items:center;gap:8px}
.time{font-variant-numeric:tabular-nums;font-size:12px;color:#ccc;min-width:86px}
.spacer{flex:1}
#play{width:48px;height:48px;font-size:22px;background:var(--c1);color:#000}
#play:hover{background:#ffb86c}

/* ---------- panel ---------- */
#panel{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-left:1px solid var(--line);z-index:10;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .25s}
#panel.open{transform:none}
#panel header{display:flex;align-items:center;padding:max(10px,env(safe-area-inset-top)) 12px 0;gap:6px}
#panel header .brand{font-weight:800;font-size:16px;background:linear-gradient(135deg,var(--c1),var(--c2),var(--c3));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.tabs{display:flex;border-bottom:1px solid var(--line);margin-top:8px}
.tabs button{flex:1;padding:10px;color:var(--muted);border-bottom:2px solid transparent}
.tabs button.active{color:#fff;border-bottom-color:var(--c2)}
.tab{display:none;flex:1;overflow:auto;padding:14px 12px 24px}
.tab.active{display:block}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.field input[type=text],.field input[type=url],.field textarea,.field select{width:100%;padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,.06)}
.field textarea{min-height:130px;font-family:ui-monospace,Menlo,monospace;font-size:12px;resize:vertical}
.field input[type=range]{width:100%}
.inline{display:flex;gap:6px}
.inline input{flex:1}
.btn{padding:9px 14px;border-radius:8px;background:rgba(255,255,255,.12);white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.2)}
.btn.primary{background:var(--c2);color:#fff}
.btn.primary:hover{background:#f05a9a}
.btn.small{padding:5px 9px;font-size:12px}
.list{list-style:none;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.list li{display:flex;align-items:center;gap:8px;padding:9px 10px;border-bottom:1px solid var(--line);cursor:pointer}
.list li:last-child{border-bottom:0}
.list li:hover{background:rgba(255,255,255,.06)}
.list li.current{background:rgba(223,67,132,.18)}
.list .t{flex:1;min-width:0;font-size:13px}
.list .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list .t span{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list .x{color:var(--muted);padding:4px 6px}
.list .x:hover{color:#fff}
.empty-note{font-size:12px;color:var(--muted);padding:10px}
.status{font-size:12px;color:var(--muted);margin:6px 0 10px}
.hint{font-size:11px;color:var(--muted);line-height:1.6;margin-top:8px}
.check{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:10px}
.val{float:right;color:#ddd;font-size:12px}
.foot{font-size:11px;color:var(--muted);margin-top:24px;line-height:1.7}

#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:rgba(20,20,20,.95);border:1px solid var(--line);padding:10px 16px;border-radius:10px;font-size:13px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
#toast.show{opacity:1}

@media (max-width:640px){
  #panel{top:auto;height:78vh;width:100%;border-left:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0;transform:translateY(100%)}
  #panel.open{transform:none}
  .time{min-width:0}
  #nowline{bottom:100px}
}
</style>
</head>
<body>

<div id="stage">
  <div id="player-wrap"><div id="player"></div></div>
  <div id="dim"></div>
  <div id="danmaku"></div>
  <div id="nowline"></div>
  <div id="empty">
    <h1>Flowrics</h1>
    <p data-i18n="empty"></p>
  </div>
</div>

<div id="hud">
  <div class="meta">
    <div class="title" id="hudTitle">Flowrics Web</div>
    <div class="sub" id="hudSub"></div>
  </div>
  <span class="pill" id="lyricPill">—</span>
  <button class="iconbtn" id="langBtn" title="Language">EN</button>
  <button class="iconbtn" id="panelBtn" title="Menu">☰</button>
</div>

<div id="controls">
  <input type="range" id="seek" min="0" max="1000" value="0">
  <div class="row">
    <span class="time" id="time">0:00 / 0:00</span>
    <span class="spacer"></span>
    <button class="iconbtn" id="prev" title="Prev">⏮</button>
    <button class="iconbtn" id="play" title="Play">▶</button>
    <button class="iconbtn" id="next" title="Next">⏭</button>
    <span class="spacer"></span>
    <button class="iconbtn" id="repeat" title="Repeat">🔁</button>
  </div>
</div>

<aside id="panel">
  <header>
    <span class="brand">Flowrics Web</span>
    <span class="spacer"></span>
    <button class="btn small" id="langBtn2">EN</button>
    <button class="btn small" id="shareBtn" data-i18n="share"></button>
    <button class="iconbtn" id="closePanel">✕</button>
  </header>
  <div class="tabs">
    <button data-tab="queue" class="active" data-i18n="tabQueue"></button>
    <button data-tab="lyrics" data-i18n="tabLyrics"></button>
    <button data-tab="settings" data-i18n="tabSettings"></button>
  </div>

  <section class="tab active" id="tab-queue">
    <div class="field">
      <label data-i18n="ytUrl"></label>
      <div class="inline">
        <input type="url" id="urlInput" placeholder="https://www.youtube.com/watch?v=..." autocomplete="off">
        <button class="btn primary" id="addBtn" data-i18n="add"></button>
      </div>
      <div class="hint" data-i18n="ytHint"></div>
    </div>
    <ul class="list" id="queueList"></ul>
    <div class="row" style="margin-top:10px">
      <span class="spacer"></span>
      <button class="btn small" id="clearQueue" data-i18n="clear"></button>
    </div>
  </section>

  <section class="tab" id="tab-lyrics">
    <div class="field">
      <label data-i18n="track"></label>
      <input type="text" id="trackInput" autocomplete="off">
    </div>
    <div class="field">
      <label data-i18n="artist"></label>
      <div class="inline">
        <input type="text" id="artistInput" autocomplete="off">
        <button class="btn primary" id="searchBtn" data-i18n="search"></button>
      </div>
    </div>
    <div class="status" id="searchStatus"></div>
    <ul class="list" id="resultList"></ul>
    <div class="field" style="margin-top:14px">
      <label><span data-i18n="offset"></span> <span class="val" id="offsetVal">0.0s</span></label>
      <input type="range" id="offset" min="-5" max="5" step="0.1" value="0">
    </div>
    <div class="field">
      <label data-i18n="lrcManual"></label>
      <textarea id="lrcText" placeholder="[00:12.34] ..."></textarea>
      <div class="row" style="margin-top:6px">
        <span class="spacer"></span>
        <button class="btn" id="applyLrc" data-i18n="applyLrc"></button>
      </div>
    </div>
  </section>

  <section class="tab" id="tab-settings">
    <div class="field">
      <label><span data-i18n="fontSize"></span> <span class="val" id="fontSizeVal"></span></label>
      <input type="range" id="fontSize" min="16" max="72" step="1">
    </div>
    <div class="field">
      <label><span data-i18n="speed"></span> <span class="val" id="speedVal"></span></label>
      <input type="range" id="speed" min="60" max="400" step="10">
    </div>
    <div class="field">
      <label><span data-i18n="lanes"></span> <span class="val" id="lanesVal"></span></label>
      <input type="range" id="lanes" min="3" max="16" step="1">
    </div>
    <div class="field">
      <label><span data-i18n="dim"></span> <span class="val" id="dimVal"></span></label>
      <input type="range" id="dimRange" min="0" max="0.9" step="0.05">
    </div>
    <div class="field">
      <label data-i18n="font"></label>
      <select id="font">
        <option value="inherit" data-i18n="fontDefault"></option>
        <option value="'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif" data-i18n="fontSerif"></option>
        <option value="'Rounded Mplus 1c','Hiragino Maru Gothic ProN','Yu Gothic UI',sans-serif" data-i18n="fontRound"></option>
        <option value="ui-monospace,Menlo,Consolas,monospace" data-i18n="fontMono"></option>
      </select>
    </div>
    <div class="field">
      <label data-i18n="color"></label>
      <select id="color">
        <option value="white" data-i18n="colorWhite"></option>
        <option value="palette" data-i18n="colorPalette"></option>
        <option value="rainbow" data-i18n="colorRainbow"></option>
      </select>
    </div>
    <label class="check"><input type="checkbox" id="showNow"> <span data-i18n="showNow"></span></label>
    <label class="check"><input type="checkbox" id="skipCredits"> <span data-i18n="skipCredits"></span></label>
    <div class="hint" data-i18n="keys"></div>
    <div class="foot">
      <span data-i18n="credits"></span><br>
      <a href="https://bigmakers.github.io/flowrics/">Flowrics</a> · <a href="https://bigmakers.github.io/flowrics/privacy.html" data-i18n="privacy"></a> · <a href="https://bigmakers.github.io/flowrics/support.html" data-i18n="support"></a>
    </div>
  </section>
</aside>

<div id="toast"></div>

<script>
'use strict';
/* ===================== i18n ===================== */
const I18N = {
  ja: {
    empty: '右上の ☰ から YouTube の URL を追加すると、曲に合わせて歌詞が弾幕のように流れます。',
    share: '共有', tabQueue: 'キュー', tabLyrics: '歌詞', tabSettings: '設定',
    ytUrl: 'YouTube の URL または動画ID', add: '追加',
    ytHint: '例: https://www.youtube.com/watch?v=xxxx / youtu.be/xxxx / Shorts の URL も使えます。埋め込みが許可されていない動画は再生できません。',
    clear: 'すべて削除', queueEmpty: 'キューは空です',
    track: '曲名', artist: 'アーティスト', search: '検索',
    offset: '歌詞のタイミング調整', lrcManual: 'LRC を直接貼り付け', applyLrc: 'この LRC を使う',
    fontSize: '文字サイズ', speed: '流れる速さ', lanes: 'レーン数', dim: '背景の暗さ',
    font: 'フォント', fontDefault: '標準', fontSerif: '明朝', fontRound: '丸ゴシック', fontMono: '等幅',
    color: '文字色', colorWhite: '白', colorPalette: 'Flowrics カラー', colorRainbow: 'ランダム',
    showNow: '現在の行を画面下に表示', skipCredits: '作詞・作曲などのクレジット行を除外',
    keys: 'キーボード: Space 再生/停止 · ← → 5秒シーク · N 次 · P 前 · [ ] 歌詞オフセット',
    credits: '歌詞データ: LRCLIB (lrclib.net) · 動画: YouTube IFrame Player API',
    privacy: 'プライバシー', support: 'サポート',
    searching: '歌詞を検索中…', found: (n) => `${n} 件見つかりました。クリックで切り替えられます。`,
    notFound: '同期歌詞が見つかりませんでした。曲名・アーティストを直して再検索するか、LRC を貼り付けてください。',
    searchErr: '歌詞サーバーに接続できませんでした。',
    pillNone: '歌詞なし', pillSearching: '検索中', pillSynced: '同期歌詞', pillManual: '手動 LRC',
    invalidUrl: 'YouTube の URL または 11 桁の動画 ID を入力してください。',
    added: 'キューに追加しました',
    embedErr: 'この動画は埋め込み再生が許可されていません。',
    notFoundErr: '動画が見つかりません。',
    playErr: '再生できませんでした。',
    copied: 'リンクをコピーしました', copyFail: 'コピーできませんでした: ',
    repeatOff: 'リピート: オフ', repeatOne: 'リピート: 1曲', repeatAll: 'リピート: 全曲',
    durDiff: (s) => `長さの差 ${s}s`, lrcApplied: 'LRC を適用しました', lrcEmpty: '有効なタイムタグが見つかりません',
  },
  en: {
    empty: 'Open ☰ (top right) and add a YouTube URL. Lyrics will flow across the screen in sync with the music.',
    share: 'Share', tabQueue: 'Queue', tabLyrics: 'Lyrics', tabSettings: 'Settings',
    ytUrl: 'YouTube URL or video ID', add: 'Add',
    ytHint: 'e.g. https://www.youtube.com/watch?v=xxxx, youtu.be/xxxx or a Shorts URL. Videos that disallow embedding cannot be played.',
    clear: 'Clear all', queueEmpty: 'Queue is empty',
    track: 'Track', artist: 'Artist', search: 'Search',
    offset: 'Lyrics timing offset', lrcManual: 'Paste LRC manually', applyLrc: 'Use this LRC',
    fontSize: 'Font size', speed: 'Scroll speed', lanes: 'Lanes', dim: 'Background dim',
    font: 'Font', fontDefault: 'Default', fontSerif: 'Serif', fontRound: 'Rounded', fontMono: 'Monospace',
    color: 'Text color', colorWhite: 'White', colorPalette: 'Flowrics palette', colorRainbow: 'Random',
    showNow: 'Show current line at bottom', skipCredits: 'Skip credit lines (lyricist / composer)',
    keys: 'Keys: Space play/pause · ← → seek 5s · N next · P prev · [ ] lyrics offset',
    credits: 'Lyrics: LRCLIB (lrclib.net) · Video: YouTube IFrame Player API',
    privacy: 'Privacy', support: 'Support',
    searching: 'Searching lyrics…', found: (n) => `${n} result(s). Click to switch.`,
    notFound: 'No synced lyrics found. Fix the track / artist and search again, or paste an LRC.',
    searchErr: 'Could not reach the lyrics server.',
    pillNone: 'No lyrics', pillSearching: 'Searching', pillSynced: 'Synced', pillManual: 'Manual LRC',
    invalidUrl: 'Enter a YouTube URL or an 11-character video ID.',
    added: 'Added to queue',
    embedErr: 'This video does not allow embedded playback.',
    notFoundErr: 'Video not found.',
    playErr: 'Playback failed.',
    copied: 'Link copied', copyFail: 'Copy failed: ',
    repeatOff: 'Repeat: off', repeatOne: 'Repeat: one', repeatAll: 'Repeat: all',
    durDiff: (s) => `duration diff ${s}s`, lrcApplied: 'LRC applied', lrcEmpty: 'No valid time tags found',
  }
};
let lang = 'ja';
const t = (k, ...a) => { const v = (I18N[lang][k] ?? I18N.en[k] ?? k); return typeof v === 'function' ? v(...a) : v; };
function applyI18n() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  $('#langBtn').textContent = $('#langBtn2').textContent = lang === 'ja' ? 'EN' : 'JP';
  renderQueue(); updateRepeatBtn(); updatePill();
}

/* ===================== helpers ===================== */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const store = {
  get(k, d) { try { const v = localStorage.getItem('flowrics.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('flowrics.' + k, JSON.stringify(v)); } catch {} }
};
const fmt = s => { s = Math.max(0, Math.floor(s || 0)); const m = Math.floor(s / 60), r = s % 60; return `${m}:${r < 10 ? '0' : ''}${r}`; };
let toastTimer;
function toast(msg) { const el = $('#toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2600); }
function parseId(s) {
  s = (s || '').trim();
  const m = s.match(/(?:youtu\.be\/|[?&]v=|\/shorts\/|\/embed\/|\/live\/|\/v\/)([A-Za-z0-9_-]{11})/);
  if (m) return m[1];
  if (/^[A-Za-z0-9_-]{11}$/.test(s)) return s;
  return null;
}

/* ===================== state ===================== */
const settings = Object.assign({
  fontSize: 32, speed: 150, lanes: 8, dim: 0.35, font: 'inherit', color: 'white', showNow: true, skipCredits: true
}, store.get('settings', {}));
let queue = store.get('queue', []);   // [{id,title,author}]
let cur = -1;
let repeat = store.get('repeat', 'all');
let player = null, ready = false;
let lines = [], idx = 0, lastT = 0, offset = 0, lyricSource = 'none';
let candidates = [], searchedFor = null;
let laneFree = [];
let seeking = false;

/* ===================== danmaku ===================== */
const PALETTE = ['#F6A656', '#DF4384', '#43B8B1', '#ffffff', '#ffd166'];
function laneCount() { return settings.lanes; }
function spawn(text) {
  const box = $('#danmaku'); const W = box.clientWidth, H = box.clientHeight;
  const el = document.createElement('div'); el.className = 'dm'; el.textContent = text;
  if (settings.color === 'palette') el.style.color = PALETTE[Math.floor(Math.random() * PALETTE.length)];
  else if (settings.color === 'rainbow') el.style.color = `hsl(${Math.floor(Math.random() * 360)} 90% 75%)`;
  box.appendChild(el);
  const w = el.offsetWidth;
  const speed = settings.speed;                // px per second
  const dur = (W + w) / speed;
  const now = performance.now();
  // choose lane: first free lane, else the one that frees soonest
  const n = laneCount(); if (laneFree.length !== n) laneFree = new Array(n).fill(0);
  let lane = laneFree.findIndex(f => f <= now);
  if (lane < 0) { lane = 0; for (let i = 1; i < n; i++) if (laneFree[i] < laneFree[lane]) lane = i; }
  laneFree[lane] = now + (w / speed) * 1000 + 250;
  const top = H * 0.08, usable = H * 0.72;
  const laneH = Math.min(settings.fontSize * 1.45, usable / n);
  el.style.top = (top + lane * laneH) + 'px';
  el.style.setProperty('--dist', `-${W + w}px`);
  el.style.animationDuration = dur + 's';
  el.addEventListener('animationend', () => el.remove());
}
function clearDanmaku() { $('#danmaku').innerHTML = ''; laneFree = []; }
function setNow(text) { $('#nowline').textContent = text || ''; }

/* ===================== LRC ===================== */
const CREDIT_RE = /^(作词|作曲|编曲|作詞|編曲|词|曲|歌|唱|监制|製作|制作|Lyrics?|Lyricist|Composer|Composed|Arranger?|Arranged|Producer|Produced|Written|Music|Vocals?)\s*(by)?\s*[:：]/i;
function parseLRC(text) {
  const out = [];
  for (const raw of (text || '').split(/\r?\n/)) {
    const tags = [...raw.matchAll(/\[(\d+):(\d+(?:\.\d+)?)\]/g)];
    if (!tags.length) continue;
    const txt = raw.replace(/\[[^\]]*\]/g, '').trim();
    if (!txt) continue;
    if (settings.skipCredits && CREDIT_RE.test(txt)) continue;
    for (const m of tags) out.push({ t: +m[1] * 60 + +m[2], text: txt });
  }
  out.sort((a, b) => a.t - b.t);
  return out;
}
function setLines(newLines, source) {
  lines = newLines; lyricSource = source; idx = 0; clearDanmaku(); setNow('');
  if (player && ready) { const cT = player.getCurrentTime() + offset; idx = lines.findIndex(l => l.t > cT); if (idx < 0) idx = lines.length; }
  updatePill();
}
function updatePill() {
  const p = $('#lyricPill'); p.className = 'pill';
  if (lyricSource === 'searching') { p.textContent = t('pillSearching'); }
  else if (lyricSource === 'synced') { p.textContent = t('pillSynced'); p.classList.add('ok'); }
  else if (lyricSource === 'manual') { p.textContent = t('pillManual'); p.classList.add('ok'); }
  else { p.textContent = t('pillNone'); if (cur >= 0) p.classList.add('warn'); }
}

/* ===================== metadata guess ===================== */
const NOISE = /\b(official|music|video|mv|pv|lyrics?|lyric|audio|hd|hq|4k|full|ver\.?|version|live|cover|feat\.?|ft\.?|remix)\b/gi;
function cleanTitle(s) {
  return (s || '')
    .replace(/[\(\[【（［「『][^\)\]】）］」』]*(official|music|video|mv|pv|lyric|audio|full|ver|4k|hd|公式|ミュージックビデオ|歌詞|フル)[^\)\]】）］」』]*[\)\]】）］」』]/gi, ' ')
    .replace(/[\[\]【】（）()「」『』]/g, ' ')
    .replace(NOISE, ' ')
    .replace(/[|｜]/g, ' ')
    .replace(/\s+/g, ' ').trim();
}
function cleanAuthor(s) {
  return (s || '').replace(/\s*-\s*topic$/i, '').replace(/vevo/gi, '').replace(/\b(official|channel)\b/gi, '').replace(/(公式|チャンネル)/g, '').replace(/\s+/g, ' ').trim();
}
function guessMeta(rawTitle, rawAuthor) {
  const author = cleanAuthor(rawAuthor);
  let title = (rawTitle || '');
  let track = '', artist = '';
  // 「Track」 or 『Track』 pattern: Artist「Track」
  let m = title.match(/^(.*?)[「『]([^」』]+)[」』]/);
  if (m) { artist = cleanTitle(m[1]); track = cleanTitle(m[2]); }
  else {
    const parts = cleanTitle(title).split(/\s+[-–—\/／]\s+/).map(x => x.trim()).filter(Boolean);
    if (parts.length >= 2) {
      const a = parts[0], b = parts.slice(1).join(' ');
      const lower = author.toLowerCase();
      if (lower && b.toLowerCase().includes(lower)) { track = a; artist = b; }
      else if (lower && a.toLowerCase().includes(lower)) { artist = a; track = b; }
      else { artist = a; track = b; }           // default: "Artist - Track"
    } else { track = cleanTitle(title); }
  }
  if (!artist) artist = author;
  return { track: track.trim(), artist: artist.trim(), q: cleanTitle(title) };
}

/* ===================== LRCLIB search ===================== */
// ratio of repeated timestamps: high values usually mean interleaved translation lines
function dupRatio(lrc) {
  const tags = (lrc || '').match(/^\[\d+:\d+(?:\.\d+)?\]/gm) || [];
  if (tags.length < 4) return 0;
  return 1 - new Set(tags).size / tags.length;
}
async function fetchJSON(url) { const r = await fetch(url, { headers: { 'Accept': 'application/json' } }); if (!r.ok) throw new Error(r.status); return r.json(); }
async function searchLyrics({ track, artist, q }, auto) {
  const status = $('#searchStatus'); status.textContent = t('searching'); lyricSource = 'searching'; updatePill();
  $('#resultList').innerHTML = '';
  const enc = encodeURIComponent;
  const reqs = [];
  if (track) reqs.push(fetchJSON(`https://lrclib.net/api/search?track_name=${enc(track)}${artist ? '&artist_name=' + enc(artist) : ''}`).catch(() => []));
  if (q) reqs.push(fetchJSON(`https://lrclib.net/api/search?q=${enc(q)}`).catch(() => []));
  if (track && artist) reqs.push(fetchJSON(`https://lrclib.net/api/search?q=${enc(track + ' ' + artist)}`).catch(() => []));
  let results;
  try { results = (await Promise.all(reqs)).flat(); } catch { status.textContent = t('searchErr'); lyricSource = 'none'; updatePill(); return; }
  const seen = new Set();
  const vd = (player && ready) ? player.getDuration() : 0;
  candidates = results.filter(r => r && r.syncedLyrics && !seen.has(r.id) && seen.add(r.id))
    .map(r => ({ ...r, diff: vd > 0 && r.duration ? Math.abs(r.duration - vd) : 999, dup: dupRatio(r.syncedLyrics) }))
    .sort((a, b) => (a.diff + a.dup * 5) - (b.diff + b.dup * 5));
  if (!candidates.length) { status.textContent = t('notFound'); lyricSource = 'none'; updatePill(); return; }
  status.textContent = t('found', candidates.length);
  renderResults();
  pickCandidate(0);
}
function renderResults() {
  const ul = $('#resultList'); ul.innerHTML = '';
  candidates.slice(0, 12).forEach((c, i) => {
    const li = document.createElement('li'); li.dataset.i = i;
    if (c.picked) li.classList.add('current');
    li.innerHTML = `<div class="t"><b></b><span></span></div>`;
    li.querySelector('b').textContent = `${c.trackName} — ${c.artistName}`;
    li.querySelector('span').textContent = `${c.albumName || ''} · ${fmt(c.duration)}${c.diff < 999 ? ' · ' + t('durDiff', Math.round(c.diff)) : ''}`;
    li.addEventListener('click', () => pickCandidate(i));
    ul.appendChild(li);
  });
}
function pickCandidate(i) {
  candidates.forEach((c, j) => c.picked = (j === i));
  const c = candidates[i]; if (!c) return;
  $('#lrcText').value = c.syncedLyrics;
  setLines(parseLRC(c.syncedLyrics), 'synced');
  renderResults();
}

/* ===================== queue ===================== */
function saveQueue() { store.set('queue', queue); }
function renderQueue() {
  const ul = $('#queueList'); ul.innerHTML = '';
  if (!queue.length) { ul.innerHTML = `<li class="empty-note">${t('queueEmpty')}</li>`; return; }
  queue.forEach((q, i) => {
    const li = document.createElement('li'); if (i === cur) li.classList.add('current');
    li.innerHTML = `<img alt="" width="48" height="27" style="border-radius:4px;object-fit:cover;flex:none"><div class="t"><b></b><span></span></div><button class="x" title="remove">✕</button>`;
    li.querySelector('img').src = `https://i.ytimg.com/vi/${q.id}/default.jpg`;
    li.querySelector('b').textContent = q.title || q.id;
    li.querySelector('span').textContent = q.author || '';
    li.addEventListener('click', e => { if (e.target.classList.contains('x')) return; playIndex(i); });
    li.querySelector('.x').addEventListener('click', () => removeAt(i));
    ul.appendChild(li);
  });
}
function addUrl(s) {
  const id = parseId(s);
  if (!id) { toast(t('invalidUrl')); return false; }
  queue.push({ id }); saveQueue(); renderQueue(); toast(t('added'));
  if (cur < 0) playIndex(queue.length - 1);
  return true;
}
function removeAt(i) {
  queue.splice(i, 1);
  if (i === cur) { cur = -1; if (player && ready) { player.stopVideo(); } lines = []; setLines([], 'none'); $('#empty').classList.remove('hidden'); $('#hudTitle').textContent = 'Flowrics Web'; $('#hudSub').textContent = ''; if (queue.length) playIndex(Math.min(i, queue.length - 1)); }
  else if (i < cur) cur--;
  saveQueue(); renderQueue();
}
function playIndex(i, autoplay = true) {
  if (i < 0 || i >= queue.length || !player || !ready) return;
  cur = i; const item = queue[i];
  searchedFor = null; setLines([], 'none'); candidates = []; $('#resultList').innerHTML = ''; $('#searchStatus').textContent = ''; $('#lrcText').value = '';
  offset = store.get('offset.' + item.id, 0); $('#offset').value = offset; $('#offsetVal').textContent = offset.toFixed(1) + 's';
  $('#empty').classList.add('hidden');
  $('#hudTitle').textContent = item.title || item.id; $('#hudSub').textContent = item.author || '';
  if (autoplay) player.loadVideoById(item.id); else player.cueVideoById(item.id);
  renderQueue();
}
function nextTrack(fromEnd) {
  if (!queue.length) return;
  let n = cur + 1;
  if (n >= queue.length) { if (fromEnd && repeat !== 'all') return; n = 0; }
  playIndex(n);
}
function prevTrack() {
  if (!queue.length) return;
  if (player && ready && player.getCurrentTime() > 3) { player.seekTo(0, true); return; }
  playIndex((cur - 1 + queue.length) % queue.length);
}
function updateRepeatBtn() {
  const b = $('#repeat');
  b.classList.toggle('active', repeat !== 'off');
  b.textContent = repeat === 'one' ? '🔂' : '🔁';
  b.title = t(repeat === 'one' ? 'repeatOne' : repeat === 'all' ? 'repeatAll' : 'repeatOff');
}

/* ===================== YouTube player ===================== */
function onYouTubeIframeAPIReady() {
  player = new YT.Player('player', {
    width: '100%', height: '100%',
    playerVars: { controls: 0, rel: 0, modestbranding: 1, playsinline: 1, iv_load_policy: 3, disablekb: 1, fs: 0, origin: location.origin },
    events: { onReady, onStateChange, onError }
  });
}
window.onYouTubeIframeAPIReady = onYouTubeIframeAPIReady;
function onReady() {
  ready = true;
  if (queue.length) playIndex(0, false);
  requestAnimationFrame(tick);
}
function onStateChange(e) {
  const S = YT.PlayerState;
  const playing = e.data === S.PLAYING;
  $('#play').textContent = playing ? '❚❚' : '▶';
  $('#danmaku').classList.toggle('paused', !playing);
  const vd = player.getVideoData ? player.getVideoData() : null;
  if (vd && vd.video_id && cur >= 0 && queue[cur] && queue[cur].id === vd.video_id) {
    if (vd.title && queue[cur].title !== vd.title) { queue[cur].title = vd.title; queue[cur].author = cleanAuthor(vd.author); saveQueue(); renderQueue(); $('#hudTitle').textContent = vd.title; $('#hudSub').textContent = queue[cur].author; document.title = vd.title + ' - Flowrics Web'; }
    if (vd.title && searchedFor !== vd.video_id && (e.data === S.PLAYING || e.data === S.BUFFERING || e.data === S.CUED)) {
      searchedFor = vd.video_id;
      const g = guessMeta(vd.title, vd.author);
      $('#trackInput').value = g.track; $('#artistInput').value = g.artist;
      searchLyrics(g, true);
    }
  }
  if (e.data === S.ENDED) {
    if (repeat === 'one') { player.seekTo(0, true); player.playVideo(); }
    else nextTrack(true);
  }
}
function onError(e) {
  const code = e.data;
  toast(code === 101 || code === 150 ? t('embedErr') : code === 100 ? t('notFoundErr') : t('playErr'));
  if (queue.length > 1) setTimeout(() => { if (cur >= 0) nextTrack(true); }, 1800);
}

/* ===================== sync loop ===================== */
function tick() {
  requestAnimationFrame(tick);
  if (!ready || !player.getCurrentTime) return;
  const raw = player.getCurrentTime() || 0, dur = player.getDuration() || 0;
  if (!seeking) { $('#seek').value = dur ? Math.round(raw / dur * 1000) : 0; }
  $('#time').textContent = `${fmt(raw)} / ${fmt(dur)}`;
  const tt = raw + offset;
  if (tt < lastT - 0.8) { idx = lines.findIndex(l => l.t >= tt); if (idx < 0) idx = lines.length; clearDanmaku(); setNow(''); }
  while (idx < lines.length && lines[idx].t <= tt) {
    const L = lines[idx++];
    if (L.t >= tt - 1.2 && player.getPlayerState() === YT.PlayerState.PLAYING) spawn(L.text);
    setNow(L.text);
  }
  lastT = tt;
}

/* ===================== UI wiring ===================== */
function applySettings() {
  document.documentElement.style.setProperty('--dm-size', settings.fontSize + 'px');
  document.documentElement.style.setProperty('--dim', settings.dim);
  document.documentElement.style.setProperty('--dm-font', settings.font);
  $('#fontSize').value = settings.fontSize; $('#fontSizeVal').textContent = settings.fontSize + 'px';
  $('#speed').value = settings.speed; $('#speedVal').textContent = settings.speed + ' px/s';
  $('#lanes').value = settings.lanes; $('#lanesVal').textContent = settings.lanes;
  $('#dimRange').value = settings.dim; $('#dimVal').textContent = Math.round(settings.dim * 100) + '%';
  $('#font').value = settings.font; $('#color').value = settings.color;
  $('#showNow').checked = settings.showNow; $('#skipCredits').checked = settings.skipCredits;
  $('#nowline').classList.toggle('hidden', !settings.showNow);
  store.set('settings', settings);
}
function bind(id, key, parse, after) {
  $('#' + id).addEventListener('input', e => { settings[key] = parse(e.target); applySettings(); if (after) after(); });
}
bind('fontSize', 'fontSize', e => +e.value);
bind('speed', 'speed', e => +e.value);
bind('lanes', 'lanes', e => +e.value, () => { laneFree = []; });
bind('dimRange', 'dim', e => +e.value);
bind('font', 'font', e => e.value);
bind('color', 'color', e => e.value);
bind('showNow', 'showNow', e => e.checked);
bind('skipCredits', 'skipCredits', e => e.checked, () => { const txt = $('#lrcText').value; if (txt) setLines(parseLRC(txt), lyricSource === 'none' ? 'manual' : lyricSource); });

$('#panelBtn').addEventListener('click', () => $('#panel').classList.toggle('open'));
$('#closePanel').addEventListener('click', () => $('#panel').classList.remove('open'));
$$('.tabs button').forEach(b => b.addEventListener('click', () => {
  $$('.tabs button').forEach(x => x.classList.toggle('active', x === b));
  $$('.tab').forEach(x => x.classList.toggle('active', x.id === 'tab-' + b.dataset.tab));
}));
function toggleLang() { lang = lang === 'ja' ? 'en' : 'ja'; store.set('lang', lang); applyI18n(); }
$('#langBtn').addEventListener('click', toggleLang);
$('#langBtn2').addEventListener('click', toggleLang);

$('#addBtn').addEventListener('click', () => { if (addUrl($('#urlInput').value)) $('#urlInput').value = ''; });
$('#urlInput').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); $('#addBtn').click(); } });
$('#clearQueue').addEventListener('click', () => { queue = []; cur = -1; saveQueue(); renderQueue(); if (player && ready) player.stopVideo(); setLines([], 'none'); $('#empty').classList.remove('hidden'); $('#hudTitle').textContent = 'Flowrics Web'; $('#hudSub').textContent = ''; });

$('#play').addEventListener('click', () => {
  if (!player || !ready) return;
  if (cur < 0) { if (queue.length) playIndex(0); else $('#panel').classList.add('open'); return; }
  const s = player.getPlayerState();
  if (s === YT.PlayerState.PLAYING) player.pauseVideo(); else player.playVideo();
});
$('#next').addEventListener('click', () => nextTrack(false));
$('#prev').addEventListener('click', prevTrack);
$('#repeat').addEventListener('click', () => { repeat = repeat === 'off' ? 'all' : repeat === 'all' ? 'one' : 'off'; store.set('repeat', repeat); updateRepeatBtn(); toast($('#repeat').title); });
$('#seek').addEventListener('pointerdown', () => seeking = true);
$('#seek').addEventListener('change', e => { seeking = false; if (player && ready) { const d = player.getDuration() || 0; player.seekTo(e.target.value / 1000 * d, true); } });
$('#seek').addEventListener('pointerup', () => seeking = false);

$('#searchBtn').addEventListener('click', () => { const track = $('#trackInput').value.trim(), artist = $('#artistInput').value.trim(); if (!track && !artist) return; searchLyrics({ track, artist, q: (track + ' ' + artist).trim() }, false); });
$('#trackInput').addEventListener('keydown', e => { if (e.key === 'Enter') $('#searchBtn').click(); });
$('#artistInput').addEventListener('keydown', e => { if (e.key === 'Enter') $('#searchBtn').click(); });
$('#applyLrc').addEventListener('click', () => { const L = parseLRC($('#lrcText').value); if (!L.length) { toast(t('lrcEmpty')); return; } candidates.forEach(c => c.picked = false); renderResults(); setLines(L, 'manual'); toast(t('lrcApplied')); });
function setOffset(v) { offset = Math.max(-5, Math.min(5, Math.round(v * 10) / 10)); $('#offset').value = offset; $('#offsetVal').textContent = (offset > 0 ? '+' : '') + offset.toFixed(1) + 's'; if (cur >= 0) store.set('offset.' + queue[cur].id, offset); }
$('#offset').addEventListener('input', e => setOffset(+e.target.value));

$('#shareBtn').addEventListener('click', async () => {
  const url = location.origin + location.pathname + (queue.length ? '?v=' + queue.map(q => q.id).join(',') : '');
  try { await navigator.clipboard.writeText(url); toast(t('copied')); } catch (e) { prompt('URL', url); }
});

document.addEventListener('keydown', e => {
  if (['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName)) return;
  if (!player || !ready) return;
  if (e.code === 'Space') { e.preventDefault(); $('#play').click(); }
  else if (e.key === 'ArrowRight') player.seekTo(player.getCurrentTime() + 5, true);
  else if (e.key === 'ArrowLeft') player.seekTo(Math.max(0, player.getCurrentTime() - 5), true);
  else if (e.key === 'n' || e.key === 'N') nextTrack(false);
  else if (e.key === 'p' || e.key === 'P') prevTrack();
  else if (e.key === '[') setOffset(offset - 0.1);
  else if (e.key === ']') setOffset(offset + 0.1);
});
window.addEventListener('resize', () => { laneFree = []; });

/* ===================== boot ===================== */
(function boot() {
  lang = store.get('lang', (navigator.language || '').toLowerCase().startsWith('ja') ? 'ja' : 'en');
  const p = new URLSearchParams(location.search);
  const ids = (p.get('v') || p.get('ids') || '').split(',').map(parseId).filter(Boolean);
  if (ids.length) { queue = ids.map(id => ({ id })); saveQueue(); }
  applySettings(); applyI18n();
  const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(s);
})();
</script>
